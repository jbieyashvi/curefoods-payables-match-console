  norm:{cls:'',     sw:'sw-ok',   glyph:'scale', label:'Matched after normalization'},
  warn:{cls:'warn', sw:'sw-warn', glyph:'warn',  label:'Needs attention'},
  bad: {cls:'bad',  sw:'sw-bad',  glyph:'block', label:'Blocking mismatch'},
  nc:  {cls:'',     sw:'sw-ok',   glyph:'note',  label:'Non-commercial line'}
};
function lineVerdict(l){
  if(l.isFreight) return 'nc';
  if(l.verdict==='bad') return 'bad';
  if(l.verdict==='warn') return 'warn';
  return l.norm ? 'norm' : 'ok';
}
function cellCls(v){ return v==='bad'?'cell-bad':(v==='warn'?'cell-warn':'cell-ok'); }
function qtyStrU(n,u){ return `${n}${u?' '+u:''}`; }

function cmpTable(c,l){
  const v = lineVerdict(l);
  const gp = l.grnPrice!=null?l.grnPrice:l.poPrice;
  const nc = l.isFreight;
  // per-field verdicts
  const vQty  = nc ? 'nc' : (Math.abs(l.dQty)<0.001 ? 'ok' : (l.verdict==='bad' && Math.abs(l.dQty)>0.001 ? 'bad' : 'warn'));
  const vRate = nc ? 'nc' : (Math.abs(l.dPrice)<0.001 ? 'ok' : (l.verdict==='bad' ? 'bad' : 'warn'));
  const vTax  = (l.invTaxPctEff===l.taxPct) ? 'ok' : 'warn';
  const vTot  = nc ? 'nc' : (Math.abs(l.dTotal)<0.01 ? 'ok' : (l.verdict==='bad' ? 'bad' : 'warn'));
  const cc = x => x==='nc' ? '' : cellCls(x);
  const expQty = nc ? '<span class="subtle">Not on PO</span>' : qtyStrU(l.grnReceived, l.uomPo||'');
  const expRate= nc ? '<span class="subtle">—</span>' : inr(gp);
  return `<div class="cmp-scroll"><table class="cmp">
    <caption class="vis-hidden">Expected values from the purchase order and goods received note compared with values extracted from the invoice for ${esc(l.name==='—'?l.invName:l.name)}</caption>
    <thead><tr>
      <th class="srccol" scope="col">Source</th>
      <th scope="col">Quantity</th><th scope="col">UOM</th><th scope="col">Unit rate</th>
      <th scope="col">Discount</th><th scope="col">Tax rate</th><th scope="col">Tax amount</th>
      <th scope="col">Subtotal</th><th scope="col">Line total</th>
    </tr></thead>
    <tbody>
      <tr>
        <th class="srccol" scope="row"><span class="srclab">
          <span class="l1"><span class="layer layer-po">Expected</span>From PO / GRN</span>
          <span class="l2">${esc(c.grnNo)}</span></span></th>
        <td>${expQty}</td><td>${esc(l.uomPo||'—')}</td><td>${expRate}</td>
        <td>${l.poDisc?inr(l.poDisc):'—'}</td><td>${nc?'—':l.taxPct+'%'}</td><td>${nc?'—':inr(l.grnTax)}</td>
        <td>${nc?'—':inr(l.grnSub)}</td><td>${nc?'—':`<strong>${inr(l.grnTotal)}</strong>`}</td>
      </tr>
      <tr>
        <th class="srccol" scope="row"><span class="srclab">
          <span class="l1"><span class="layer layer-ocr">Extracted</span>From invoice</span>
          <span class="l2">${esc(c.invoice.no)} · line ${l.invLineNo}</span></span></th>
        <td class="${cc(vQty)}">${qtyStrU(l.invQty, l.uomInv||'')}${l.norm?`<span class="cell-sub">${l.normQty} ${esc(l.uomPo||'')} normalized</span>`:''}</td>
        <td class="${cc(l.norm?'ok':(String(l.uomInv||'').toLowerCase()===String(l.uomPo||'').toLowerCase()?'ok':'ok'))}">${esc(l.uomInv||'—')}</td>
        <td class="${cc(vRate)}">${inr(l.invPrice)}${l.norm?`<span class="cell-sub">${inr(l.normPrice)} per ${esc(l.uomPo||'unit')} normalized</span>`:''}</td>
        <td>${l.invDisc?inr(l.invDisc):'—'}</td>
        <td class="${cc(vTax)}">${l.invTaxPctEff}%</td>
        <td>${inr(l.invTax)}</td>
        <td>${inr(l.invSub)}</td>
        <td class="${cc(vTot)}"><strong>${inr(l.invTotal)}</strong></td>
      </tr>
    </tbody>
  </table></div>`;
}

function outcomeStrip(c,l){
  const v = lineVerdict(l);
  if(l.isFreight) return `<div class="nc-note">${ic('note','class="ic"')} Non-commercial line. Freight and handling of <strong>${inr(l.invTotal)}</strong> is charged on the invoice but does not appear on the purchase order, so it is reported separately and is not part of the quantity or rate comparison.</div>`;
  const bits = [];
  if(Math.abs(l.dQty)>0.001) bits.push(`${Math.abs(l.dQty)} ${l.uomPo||'units'} ${l.dQty>0?'excess':'short'}`);
  if(Math.abs(l.dPrice)>0.001) bits.push(`${inr(Math.abs(l.dPrice))} per ${l.uomPo||'unit'} ${l.dPrice>0?'higher':'lower'}`);
  if(l.invTaxPctEff!==l.taxPct) bits.push(`GST ${Math.abs(l.invTaxPctEff-l.taxPct)} points ${l.invTaxPctEff>l.taxPct?'higher':'lower'}`);
  const cls = v==='bad'?'bad':(v==='warn'?'warn':'ok');
  const delta = Math.abs(l.dTotal)<0.01
    ? 'No difference'
    : `${inr(Math.abs(l.dTotal))} ${l.dTotal>0?'higher':'lower'} than the receipt`;
  const why = v==='norm'
    ? 'Units differ between the invoice and the receipt, but after normalization the quantity and value agree exactly.'
    : (bits.length ? bits.join(' · ') : 'Quantity, rate and tax on the invoice agree with the goods received note.');
  return `<div class="li-outcome ${cls}">
    <span class="li-delta">${delta}</span>
    <span class="why">${why}</span>
    <span class="li-chipset">${(l.notes||[]).map(n=>`<span class="chip chip-neutral tiny">${ic('note')}${esc(n)}</span>`).join('')}</span>
  </div>`;
}

function lineCard(c,l,i){
  const v = lineVerdict(l);
  const d = VERDICT[v];
  return `<article class="li-card ${d.cls}${S.lineHi===l.sku?' hi':''}" id="li-${esc(l.sku)}">
    <div class="li-head">
      <span class="li-sku">${esc(l.sku)}</span>
      <span class="li-name">${esc(l.name==='—'?l.invName:l.name)}</span>
      ${l.name!=='—' && l.invName && l.invName.toUpperCase()!==l.name.toUpperCase()
        ? `<span class="chip chip-neutral tiny" title="Description printed on the invoice">${ic('file')}Invoice reads “${esc(l.invName)}”</span>`:''}
      <span class="li-verdict"><span class="legend sw ${d.sw}" style="display:grid;padding:0;border-width:1px;width:16px;height:16px;border-style:solid;border-radius:4px">${ic(d.glyph)}</span>${d.label}</span>
    </div>
    ${cmpTable(c,l)}
    ${l.norm?`<div class="norm-panel">
      <span class="layer layer-norm">Normalized for comparison</span>
      <span class="norm-eq">${esc(l.norm.reasonQty)}</span>
      <span class="norm-eq">${esc(l.norm.reasonPrice)}</span>
      <span class="norm-why">${esc(l.norm.why)}</span>
    </div>`:''}
    ${outcomeStrip(c,l)}
  </article>`;
}

function tabLines(c,row){
  if(!c.invoice) return `<div class="card"><div class="empty">
    <span class="glyphbox">${ic('scale')}</span>
    <h3>Nothing to compare yet</h3>
    <p>Line comparison needs an extracted invoice. No invoice document is attached to <strong>${esc(c.grnNo)}</strong>, so there is no invoice side to place against the receipt.</p>
    <div class="acts"><button class="btn btn-primary sm" type="button" data-act="dlg" data-arg="upload">${ic('upload')}Upload invoice and re-run</button></div>
  </div></div>`;
  const all = c.lines;
  const counts = {
    ALL: all.length,
    MATCHED: all.filter(l=>!l.isFreight && (lineVerdict(l)==='ok'||lineVerdict(l)==='norm')).length,
    UNMATCHED: all.filter(l=>!l.isFreight && (lineVerdict(l)==='bad'||lineVerdict(l)==='warn')).length,
    NC: all.filter(l=>l.isFreight).length
  };
  const f = S.liFilter;
  const shown = all.filter(l=>{
    const v=lineVerdict(l);
    if(f==='MATCHED') return !l.isFreight && (v==='ok'||v==='norm');
    if(f==='UNMATCHED') return !l.isFreight && (v==='bad'||v==='warn');
    if(f==='NC') return l.isFreight;
    return true;
  });
  const pills = [['ALL','All lines'],['MATCHED','Matched'],['UNMATCHED','Unmatched'],['NC','Non-commercial']];
  return `<div class="legend" role="note">
      <span class="li"><span class="sw sw-ok">${ic('check')}</span><b>Green</b> — matched, or safely normalized</span>
      <span class="li"><span class="sw sw-warn">${ic('warn')}</span><b>Amber</b> — a real difference to review, not blocking on its own</span>
      <span class="li"><span class="sw sw-bad">${ic('block')}</span><b>Red</b> — blocking commercial mismatch</span>
      <span class="ctl-grow"></span>
      <span class="li subtle">A different item description or unit alone is not an error.</span>
    </div>
    <div class="li-toolbar">
      <div class="pillbar" role="group" aria-label="Filter line items">
        ${pills.map(([k,l])=>`<button class="pill" type="button" aria-pressed="${f===k}" data-act="lifilter" data-arg="${k}">${l}<span class="cnt">${counts[k]}</span></button>`).join('')}
      </div>
      <span class="ctl-grow"></span>
      <span class="sect-sub">Invoice ${esc(c.invoice.no)} against ${esc(c.grnNo)} · ${inr(c.invoice.total)} invoiced, ${inr(c.grn.total)} received</span>
    </div>
    ${shown.length ? shown.map((l,i)=>lineCard(c,l,i)).join('') : `<div class="card"><div class="empty">
      <span class="glyphbox">${ic('search')}</span><h3>No lines in this group</h3>
      <p>No line items fall into this category on this invoice.</p>
      <div class="acts"><button class="btn sm" type="button" data-act="lifilter" data-arg="ALL">Show all lines</button></div>
    </div></div>`}`;
}
</script>
<style>
/* ---- Rule violations tab additions ---- */
.rule-main,.rule-name,.rule-where{display:block}
.rule-list{border-top:1px solid var(--line)}
.rule-why{font-size:var(--fs-body);color:var(--ink-2);line-height:1.55;margin:12px 0 0;max-width:80ch}
.delta-hero .dv.sm{font-size:15px;font-weight:600;letter-spacing:0}
.dh-cell{min-width:0}
.dh-sep{width:1px;align-self:stretch;background:currentColor;opacity:.16;flex:none}
.rule-foot{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:12px}
.rule-foot .sect-sub{margin:0}
.sev-tally{display:flex;gap:14px;flex-wrap:wrap;font-size:var(--fs-sm);color:var(--ink-2)}
.sev-tally span{display:inline-flex;align-items:center;gap:6px}
.sev-tally i{width:8px;height:8px;border-radius:50%;flex:none}
.sev-tally b{font-variant-numeric:tabular-nums;color:var(--ink)}
.res-act .rt,.res-act .rd{display:block}
.res-act .rw{min-width:0}
.res-note{font-size:var(--fs-xs);color:var(--ink-2);line-height:1.55;margin-top:12px;padding-top:11px;border-top:1px dashed var(--line)}
.norm-panel.in-rule{border:1px solid var(--green-line);border-radius:var(--r-sm);margin-top:12px}
.rule-detail .ea-grid{margin-top:12px}
.rules-alert-list{margin:7px 0 0;padding-left:17px;font-size:var(--fs-sm);color:var(--ink-2);line-height:1.75}
.rules-alert-list strong{color:var(--ink)}
.rule-empty{padding:30px 18px}
</style>
<script>
/* ============================================================================
   SCREEN 6 — RULE VIOLATIONS
   Left: every rule the engine evaluated, expandable, difference-first.
   Right: what the accountant can do about it, each behind a preview.
   ============================================================================ */
const SEV_TONE = {
  BLOCK:{bg:'var(--red-bg)',   line:'var(--red-line)',   fg:'var(--red-deep)', hero:'bad'},
  FLAG :{bg:'var(--amber-bg)', line:'var(--amber-line)', fg:'var(--amber-deep)', hero:'warn'},
  NOTE :{bg:'var(--blue-bg)',  line:'var(--blue-line)',  fg:'var(--blue)',     hero:'note'},
  PASS :{bg:'var(--green-bg)', line:'var(--green-line)', fg:'var(--green-deep)',hero:'note'},
  SKIP :{bg:'var(--surface-3)',line:'var(--line-strong)',fg:'var(--slate)',      hero:'note'}
};
const SEV_ORDER = {BLOCK:0, FLAG:1, NOTE:2, SKIP:3, PASS:4};
const RULE_SCOPE = {LINE_ITEM:'Line item', HEADER:'Invoice header', INVOICE:'Document', PURCHASE_ORDER_GRN:'Purchase order and receipts'};

function ruleCounts(c){
  const n = {ALL:c.rules.length, BLOCK:0, FLAG:0, NOTE:0, SKIP:0, PASS:0};
  c.rules.forEach(r=>{ n[r.sev] = (n[r.sev]||0)+1; });
  return n;
}
function ruleFilterKey(c){
  if(S.ruleFilter) return S.ruleFilter;
  const n = ruleCounts(c);
  if(n.BLOCK) return 'BLOCK';
  if(n.FLAG) return 'FLAG';
  return 'ALL';
}
function openRules(c){
  if(S.ruleOpen) return S.ruleOpen;
  const i = c.rules.findIndex(r=>r.sev==='BLOCK');
  const j = i>=0 ? i : c.rules.findIndex(r=>r.sev==='FLAG');
  return j>=0 ? {[j]:true} : {};
}

function ruleDetail(c,r,idx){
  const tone = SEV_TONE[r.sev] || SEV_TONE.NOTE;
  const scope = RULE_SCOPE[r.type] || 'Match';
  const scored = r.expected!=null && r.expected!=='';
  const line = r.sku ? c.lines.find(l=>l.sku===r.sku) : null;
  const hero = scored && r.diff ? `<div class="delta-hero ${tone.hero}">
      <div class="dh-cell">
        <div class="dl">Difference</div>
        <div class="dv">${esc(r.diff)}</div>
      </div>
      ${r.diffAmount?`<div class="dh-sep"></div>
      <div class="dh-cell">
        <div class="dl">What it is worth</div>
        <div class="dv sm">${esc(r.diffAmount)}</div>
      </div>`:''}
      ${r.sev!=='PASS'&&r.sev!=='SKIP'?`<span class="ctl-grow"></span><div class="dh-cell">${sevChip(r.sev)}</div>`:''}
    </div>` : '';
  const grid = scored ? `<div class="ea-grid">
      <div class="ea expected">
        <div class="k">Expected${r.type==='LINE_ITEM'?' — recorded in GRN':''}</div>
        <div class="v">${esc(r.expected)}</div>
      </div>
      <div class="ea actual${r.sev==='FLAG'||r.sev==='NOTE'?' soft':''}">
        <div class="k">Actual — extracted from invoice</div>
        <div class="v">${esc(r.actual)}</div>
      </div>
      <div class="ea">
        <div class="k">Difference</div>
        <div class="v">${esc(r.diff||'—')}</div>
      </div>
      <div class="ea">
        <div class="k">Allowed threshold</div>
        <div class="v">${esc(r.threshold||'—')}</div>
      </div>
    </div>` : '';
  const normNote = line && line.norm ? `<div class="norm-panel in-rule">
      <span class="norm-eq">${esc(line.norm.reasonQty)}</span>
      <span class="norm-eq">${esc(line.norm.reasonPrice)}</span>
      <span class="norm-why"><strong>Normalized for comparison.</strong> ${esc(line.norm.why)} The rule was evaluated on the normalized values, not on the figures printed on the invoice.</span>
    </div>` : '';
  return `<div class="rule-detail" id="rd-${idx}">
    <p class="rule-why">${esc(r.reason)}</p>
    ${hero}${grid}${normNote}
    <div class="rule-foot">
      <span class="rulecode" title="Rule identifier used by the match engine">${esc(r.code)}</span>
      <span class="sect-sub">Scope: ${esc(scope)}${r.field?' · Field: '+esc(r.field):''}</span>
      <span class="ctl-grow"></span>
      ${r.sku && c.invoice ? `<button class="btn xs" type="button" data-act="goline" data-arg="${esc(r.sku)}">${ic('scale')}Open this line</button>` : ''}
    </div>
  </div>`;
}

function ruleRow(c,r,idx,open){
  const tone = SEV_TONE[r.sev] || SEV_TONE.NOTE;
  const s = SEV[r.sev] || SEV.NOTE;
  const delta = (r.sev==='PASS') ? '' : (r.diff || '');
  return `<div class="rule-row" data-open="${open?1:0}">
    <button class="rule-btn" type="button" style="--sev:${s.colour}" data-act="rule" data-arg="${idx}"
            aria-expanded="${open}" aria-controls="rd-${idx}">
      <span class="caret">${ic('chevR')}</span>
      <span class="rule-ico" style="background:${tone.bg};border-color:${tone.line};color:${tone.fg}">${ic(s.glyph)}</span>
      <span class="rule-main">
        <span class="rule-name">${esc(r.name)}</span>
        <span class="rule-where">${esc(r.where||'—')}</span>
      </span>
      ${delta?`<span class="rule-delta" style="color:${tone.fg}">${esc(delta)}</span>`:''}
      ${sevChip(r.sev,true)}
    </button>
    ${open?ruleDetail(c,r,idx):''}
  </div>`;
}

function resolutionActions(c){
  const blocking = c.rules.filter(r=>r.sev==='BLOCK');
  const flags = c.rules.filter(r=>r.sev==='FLAG');
  const noInvoice = !c.invoice;
  const priceOrQty = blocking.some(r=>['LINE_ITEM_QTY_GT_GRN','LINE_ITEM_MISMATCH','HEADER_INVOICE_TOTAL_MISMATCH','LINE_ITEM_SUBTOTAL','LINE_ITEM_TOTAL_ISSUE'].indexOf(r.code)>=0);
  const badDoc = blocking.some(r=>['BAD_DOCUMENT','MANDATORY_FIELD_MISSING','VENDOR_MISSING'].indexOf(r.code)>=0);
  const acts = [];
  const A = (id,icon,title,desc,primary)=>acts.push({id,icon,title,desc,primary:!!primary});

  if(c.status==='SKIPPED'){
    A('rerun','refresh','Re-run pipeline','Nothing runs while the receipt is reversed. Re-run once the receiving location raises a fresh GRN.',false);
    A('grncorr','truck','Request GRN correction','Ask the receiving location to confirm the reversal and raise a replacement receipt.',true);
    return acts;
  }
  if(noInvoice || badDoc){
    A('upload','upload','Upload invoice and re-run','Attach a readable copy of the vendor tax invoice, then start a fresh extraction and match.',true);
  }
  if(priceOrQty){
    A('debit','filePlus','Create debit note',
      'Prepares a debit note for the excess and routes it to the kitchen or warehouse contact for confirmation first. Nothing reaches the vendor from this screen.', !noInvoice && !badDoc);
  }
  if(blocking.length || flags.length){
    A('grncorr','truck','Request GRN correction','Ask the receiving location to recheck what was physically accepted against the delivery challan.',false);
  }
  A('rerun','refresh','Re-run pipeline','Runs normalization and the rule engine again against the current purchase order, receipt and invoice.',
    !blocking.length && !noInvoice);
  if(c.invoice && !noInvoice && !badDoc){
    A('reextract','eye','Re-extract invoice','Reads the attached document again. Useful when the first pass misread the invoice number or a rate.',false);
  }
  if(!blocking.length){
    A('gooracle','cloud','Open Oracle push','Review the assembled payable and approve it for Oracle on the next tab.',false);
  }
  return acts;
}

function tabRules(c,row){
  const n = ruleCounts(c);
  const f = ruleFilterKey(c);
  const openMap = openRules(c);
  const ordered = c.rules.map((r,i)=>({r,i}))
    .sort((a,b)=> (SEV_ORDER[a.r.sev]-SEV_ORDER[b.r.sev]) || (a.i-b.i));
  const shown = ordered.filter(x=> f==='ALL' ? true : x.r.sev===f);
  const pills = [['ALL','All rules'],['BLOCK','Blocking'],['FLAG','Flags'],['NOTE','Notes'],['SKIP','Skipped'],['PASS','Passed']];
  const acts = resolutionActions(c);

  const headAlert = n.BLOCK ? `<div class="alert alert-red" role="alert">
      ${ic('block','class="ic"')}
      <div class="alert-body">
        <div class="alert-title">${n.BLOCK} rule${n.BLOCK===1?'':'s'} ${n.BLOCK===1?'is':'are'} blocking this invoice</div>
        <div class="alert-txt">The invoice cannot be prepared for Oracle until ${n.BLOCK===1?'it is':'each one is'} resolved or the underlying document is corrected.</div>
        <ul class="rules-alert-list">${c.rules.filter(r=>r.sev==='BLOCK').map(r=>`<li><strong>${esc(r.name)}</strong> — ${esc(r.diff||r.reason)}</li>`).join('')}</ul>
      </div>
    </div>`
   : (n.FLAG ? `<div class="alert alert-amber">
      ${ic('warn','class="ic"')}
      <div class="alert-body">
        <div class="alert-title">Matched with ${n.FLAG} flag${n.FLAG===1?'':'s'} to review</div>
        <div class="alert-txt">Nothing here stops the payable. Read the flags so the difference is a decision rather than a surprise later.</div>
      </div>
    </div>`
   : `<div class="alert alert-green">
      ${ic('check','class="ic"')}
      <div class="alert-body">
        <div class="alert-title">Every rule passed</div>
        <div class="alert-txt">All ${n.ALL} checks cleared on attempt ${c.attempt}. This invoice is eligible for Oracle.</div>
      </div>
    </div>`);

  const list = shown.length
    ? `<div class="rule-list">${shown.map(x=>ruleRow(c,x.r,x.i,!!openMap[x.i])).join('')}</div>`
    : `<div class="empty rule-empty">
        <span class="glyphbox">${ic('search')}</span>
        <h3>No rules in this group</h3>
        <p>The engine recorded no ${esc((SEV[f]||{label:'matching'}).label.toLowerCase())} results on attempt ${c.attempt}.</p>
        <div class="acts"><button class="btn sm" type="button" data-act="rulefilter" data-arg="ALL">Show all ${plu(n.ALL,'rule')}</button></div>
      </div>`;

  return `<div class="rule-layout">
    <div class="stack-16">
      ${headAlert}
      <div>
        <div class="li-toolbar">
          <div class="pillbar" role="group" aria-label="Filter rule results">
            ${pills.map(([k,l])=>`<button class="pill" type="button" aria-pressed="${f===k}" data-act="rulefilter" data-arg="${k}">${k!=='ALL'?`<span class="dot" style="background:${(SEV[k]||{}).colour}"></span>`:''}${l}<span class="cnt">${n[k]||0}</span></button>`).join('')}
          </div>
          <span class="ctl-grow"></span>
          <span class="sect-sub">${n.ALL} rules evaluated · attempt ${c.attempt} · ${fmtDateTime(c.lastRun)}</span>
        </div>
        <div class="card">
          <div class="card-head">
            <div>
              <div class="sect-title">Rule results</div>
              <div class="sect-sub">Sorted by severity. Open a rule to see the expected value, what the invoice actually said, and how far apart they are.</div>
            </div>
            <div class="head-acts sev-tally">
              <span><i style="background:var(--red)"></i>Blocking <b>${n.BLOCK}</b></span>
              <span><i style="background:var(--amber)"></i>Flag <b>${n.FLAG}</b></span>
              <span><i style="background:var(--blue)"></i>Note <b>${n.NOTE}</b></span>
              <span><i style="background:var(--green)"></i>Passed <b>${n.PASS}</b></span>
            </div>
          </div>
          ${list}
        </div>
      </div>
    </div>

    <div class="resbox">
      <div class="stack-16">
        <div class="card side-card">
          <div class="card-head plain">
            <div>
              <div class="sect-title">What you can do next</div>
              <div class="sect-sub">Every action opens a preview before anything is sent or processed.</div>
            </div>
          </div>
          <div class="card-body">
            ${acts.map(a=>`<button class="res-act${a.primary?' primary':''}" type="button" data-act="${a.id==='gooracle'?'tab':'dlg'}" data-arg="${a.id==='gooracle'?'oracle':a.id}">
              <span class="ri">${ic(a.icon)}</span>
              <span class="rw"><span class="rt">${esc(a.title)}</span><span class="rd">${esc(a.desc)}</span></span>
            </button>`).join('')}
            <div class="res-note">A debit note is raised against the receiving location first. It is shared with the vendor only after the kitchen or warehouse contact confirms the shortfall.</div>
          </div>
        </div>

        <div class="card side-card">
          <div class="card-head plain">
            <div>
              <div class="sect-title">Activity on this pair</div>
              <div class="sect-sub">Most recent first</div>
            </div>
          </div>
          <div class="card-body">
            <div class="timeline">
              ${c.timeline.map(t=>`<div class="tl-item ${t.kind==='bad'?'bad':(t.kind==='ok'?'now':'')}">
                <div class="tl-t">${esc(t.title)}</div>
                <div class="tl-s">${esc(t.sub)}</div>
                <div class="tl-s">${fmtDateTime(t.t)} · ${ago(t.t)}</div>
              </div>`).join('')}
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>`;
}
</script>

<script>
/* ============================================================================
   SCREEN 7 — ORACLE PUSH
   The assembled payable, exactly in the shape Oracle receives it.
   Confidence appears only where extraction fell below the trusted level.
   ============================================================================ */
const OSTATE = {
  READY :{cls:'ready',  icon:'check',  title:'Ready to push to Oracle',
          sub:'Every field Oracle needs is present. Review the payload below, then approve.'},
  REVIEW:{cls:'review', icon:'warn',   title:'Review before pushing',
          sub:'The payable is assembled but some fields still need attention.'},
  PUSHED:{cls:'pushed', icon:'check',  title:'Posted to Oracle',
          sub:'This payable already exists in Oracle Payables. Nothing further is required here.'},
  FAILED:{cls:'failed', icon:'block',  title:'Oracle rejected this payable',
          sub:'The push reached Oracle and came back with an error. Fix the cause, then push again.'}
};
const OTONE = {
  READY :{bg:'var(--green-bg-2)', line:'var(--green-line)', fg:'var(--green-deep)'},
  REVIEW:{bg:'var(--surface)',    line:'var(--amber-line)', fg:'var(--amber-deep)'},
  PUSHED:{bg:'var(--surface)',    line:'var(--green-line)', fg:'var(--green-deep)'},
  FAILED:{bg:'var(--surface)',    line:'var(--red-line)',   fg:'var(--red-deep)'}
};

function oracleField(f){
  const missing = !!f.missing || f.v===''||f.v==null;
  const cls = ['ofield'];
  if(missing) cls.push('missing');
  if(f.bad) cls.push('bad');
  if(S.oracleHi===f.k) cls.push('hilite');
  const badge = (!missing && f.conf!=null && f.conf<CONF_TRUST) ? confBadge(f.conf) : '';
  return `<div class="${cls.join(' ')}" id="of-${f.k}">
    <div class="f-label">${esc(f.label)}${badge}${f.help&&!missing?tip(f.help):''}</div>
    <div class="oval">${missing?'Not available':esc(String(f.v))}${f.bad?' — '+esc(f.badMsg||'rejected by Oracle'):''}</div>
    ${missing?`<div class="err-msg">${ic('warn')}Required by Oracle · ${esc(f.help||'This field could not be assembled.')}</div>`:''}
    ${f.bad?`<div class="err-msg">${ic('block')}${esc(f.badMsg||'Rejected by Oracle')}</div>`:''}
    ${!missing&&!f.bad&&f.conf!=null&&f.conf<CONF_TRUST&&f.help?`<div class="f-note">${esc(f.help)}</div>`:''}
  </div>`;
}

function oracleSection(sec,i){
  const miss = sec.fields.filter(f=>f.missing||f.v===''||f.v==null).length;
  return `<section class="osection">
    <div class="osec-h">
      <span class="n">${i+1}</span>
      <span class="osec-ico">${ic(sec.icon||'file')}</span>
      <span class="sect-title">${esc(sec.title)}</span>
      ${miss?`<span class="chip chip-blocked tiny">${ic('warn','class="glyph"')}${miss} missing</span>`:''}
      <span class="osec-count">${plu(sec.fields.length,'field')}</span>
    </div>
    <div class="ofields">${sec.fields.map(oracleField).join('')}</div>
  </section>`;
}

function oracleLines(c){
  const o = c.oracle, total = o.lines.reduce((a,l)=>a+(l.amount||0),0);
  return `<section class="osection">
    <div class="osec-h">
      <span class="n">${o.sections.length+1}</span>
      <span class="osec-ico">${ic('sheet')}</span>
      <span class="sect-title">Line items and accounting distribution</span>
      <span class="osec-count">${plu(o.lines.length,'distribution line')}</span>
    </div>
    <div class="tscroll plain">
      <table class="dt">
        <thead><tr>
          <th style="width:44px">#</th><th style="width:118px">SKU</th><th style="width:250px">Description</th>
          <th class="num" style="width:110px">Quantity</th><th class="num" style="width:112px">Unit rate</th>
          <th class="num" style="width:126px">Amount</th><th style="width:246px">Account</th><th style="width:150px">Tax code</th>
        </tr></thead>
        <tbody>
          ${o.lines.map(l=>`<tr>
            <td>${l.no}</td>
            <td><span class="sku">${esc(l.sku)}</span></td>
            <td class="wrap">${esc(l.desc)}</td>
            <td class="num">${esc(l.qty)}</td>
            <td class="num">${esc(l.rate)}</td>
            <td class="num">${inr(l.amount)}</td>
            <td class="wrap"><span class="mono">${esc(l.account)}</span></td>
            <td><span class="mono">${esc(l.taxCode)}</span></td>
          </tr>`).join('')}
          <tr>
            <td colspan="5" style="text-align:right;font-weight:600">Payable total</td>
            <td class="num" style="font-weight:700">${inr(total)}</td>
            <td colspan="2"></td>
          </tr>
        </tbody>
      </table>
    </div>
    <div class="oline-note">Amounts are the normalized values used by the matcher, not the figures printed on the invoice. Where a pack size was converted, the description carries the unit Oracle will receive.</div>
  </section>`;
}

function oracleBlocked(c,row){
  const blockedBy = c.oracle.blockedBy;
  const rule = c.rules.find(r=>r.code===blockedBy);
  const nBlock = c.rules.filter(r=>r.sev==='BLOCK').length;
  const reversed = blockedBy==='GRN_REVERSED' || c.status==='SKIPPED';
  const notRun = row.oracleState==='NOT_READY' || c.runStatus==='RUNNING' || c.status==='PENDING';
  const gates = [
    ['Invoice document extracted', !!c.invoice, c.invoice?'Read at '+Math.round((c.invoice.ocrConfidence||0)*100)+'% confidence.':'No invoice is attached to this receipt.'],
    ['Receipt is open and not reversed', !reversed, reversed?'The receiving location reversed '+c.grnNo+'.':c.grn.status+'.'],
    ['No blocking rule outstanding', nBlock===0, nBlock?nBlock+' blocking rule'+(nBlock===1?'':'s')+' still to resolve.':'All commercial checks cleared.']
  ];
  const head = notRun
    ? {t:'This pair has not been matched yet', p:'Nothing is assembled for Oracle until the match runs. Once it does, the payable appears here in the exact shape Oracle receives it.'}
    : reversed
      ? {t:'Oracle push is not available for a reversed receipt', p:'<strong>'+esc(c.grnNo)+'</strong> was reversed at the receiving location, so there is no accepted quantity to pay against. A replacement receipt has to be raised before anything can be pushed.'}
      : {t:'Oracle push is not available while the match is blocked', p:'This pair is blocked by <strong>'+esc(rule?rule.name:'a blocking rule')+'</strong>. No payable is assembled until every blocking rule is resolved, so there is nothing to approve yet.'};
  return `<div class="card"><div class="empty">
    <span class="glyphbox">${ic(notRun?'clock':'lock')}</span>
    <h3>${esc(head.t)}</h3>
    <p>${head.p}</p>
    <div class="ogate">
      ${gates.map(([t,ok,s])=>`<div class="g ${ok?'yes':'no'}">
        <div class="gt">${ic(ok?'check':'block')}${esc(t)}</div>
        <div class="gs">${esc(s)}</div>
      </div>`).join('')}
    </div>
    <div class="acts">
      ${rule?`<button class="btn btn-primary sm" type="button" data-act="gorule" data-arg="${esc(rule.code)}">${ic('target')}Go to the blocking rule</button>`:''}
      ${!c.invoice?`<button class="btn btn-primary sm" type="button" data-act="dlg" data-arg="upload">${ic('upload')}Upload invoice and re-run</button>`:''}
      <button class="btn sm" type="button" data-act="tab" data-arg="rules">${ic('list')}See all ${c.rules.length} rule results</button>
      <button class="btn sm" type="button" data-act="dlg" data-arg="rerun">${ic('refresh')}Re-run pipeline</button>
    </div>
  </div></div>`;
}

function tabOracle(c,row){
  const o = c.oracle;
  if(!o.sections || o.state==='NOT_READY') return oracleBlocked(c,row);

  const allFields = o.sections.reduce((a,s)=>a.concat(s.fields),[]);
  const missing = allFields.filter(f=>f.missing || f.v===''||f.v==null);
  const lowConf = allFields.filter(f=>!f.missing && f.conf!=null && f.conf<CONF_TRUST);
  const st = OSTATE[o.state] || OSTATE.REVIEW;
  const tone = OTONE[o.state] || OTONE.REVIEW;
  const pushable = (o.state==='READY' || o.state==='FAILED') && !missing.length;

  let sub = st.sub;
  if(o.state==='PUSHED') sub = `Oracle invoice <strong>${esc(o.oracleInvoiceNo||'')}</strong> · pushed by ${esc(o.pushedBy||'')} on ${fmtDateTime(o.pushedAt)}.`;
  else if(o.state==='FAILED') sub = `Pushed by ${esc(o.pushedBy||'')} on ${fmtDateTime(o.pushedAt)} · rejected ${ago(o.error.at)}.`;
  else if(missing.length) sub = `Oracle will not accept this payable until <button class="missing-link" type="button" data-act="omiss">${ic('arrDn')}${missing.length} required field${missing.length===1?'':'s'}</button> ${missing.length===1?'is':'are'} available.`;
  else if(lowConf.length) sub = `Every required field is present. ${lowConf.length} field${lowConf.length===1?' was':'s were'} read with reduced confidence — confirm ${lowConf.length===1?'it':'them'} before approving.`;

  const acts = o.state==='PUSHED'
    ? `<button class="btn sm" type="button" data-act="dlg" data-arg="oopen">${ic('ext')}Open in Oracle</button>
       <button class="btn sm" type="button" data-act="dlg" data-arg="opayload">${ic('download')}Download payload summary</button>`
    : `<button class="btn sm" type="button" data-act="dlg" data-arg="reassemble" title="Rebuilds the payload from the current match result">${ic('refresh')}Re-assemble</button>
       <button class="btn btn-danger sm" type="button" data-act="dlg" data-arg="oreject">${ic('x')}Reject</button>
       <button class="btn btn-primary sm" type="button" data-act="dlg" data-arg="opush"${pushable?'':' disabled aria-disabled="true"'}>${ic('cloud')}${o.state==='FAILED'?'Fix and push again':'Approve and push'}</button>`;

  const errBlock = o.state==='FAILED' ? `<div class="oerr">
      ${ic('block','class="ic" style="width:16px;height:16px;color:var(--red);flex:none;margin-top:2px"')}
      <span class="k">${esc(o.error.code)}</span>
      <span class="m"><b>${esc(o.error.title)}</b> — ${esc(o.error.msg)}</span>
    </div>` : '';

  return `<div class="opush-wrap${o.state==='PUSHED'?' is-posted':''}">
    <div class="opush-bar ${st.cls}" role="status">
      <span class="ob-ico" style="background:${tone.bg};border-color:${tone.line};color:${tone.fg}">${ic(st.icon)}</span>
      <span class="ob-main">
        <span class="ob-t">${esc(st.title)}</span>
        <span class="ob-s">${sub}</span>
      </span>
      <span class="ob-acts">${acts}</span>
    </div>
    ${errBlock?`<div class="osection" style="border-color:var(--red-line)">${errBlock}</div>`:''}

    <div class="conf-legend">
      <span class="sw" aria-hidden="true"></span>
      <span>A confidence figure appears only where extraction fell below ${Math.round(CONF_TRUST*100)}%. Fields without one were read cleanly. Values marked <strong>Not available</strong> are required by Oracle and block the push.</span>
      <span class="ctl-grow"></span>
      <span>Assembled ${fmtDateTime(o.assembledAt)} · attempt ${o.attempt}</span>
    </div>

    ${o.sections.map(oracleSection).join('')}
    ${oracleLines(c)}

    <div class="alert alert-neutral">
      ${ic('info','class="ic"')}
      <div class="alert-body">
        <div class="alert-title">What “Re-assemble” does</div>
        <div class="alert-txt">Re-assemble rebuilds this payload from the current purchase order, receipt and invoice without re-reading the document or re-running the rules. Use it after finance maps a supplier site or a cost centre, so the payload picks up the new value. To re-read the invoice itself, use <strong>Re-extract invoice</strong> on the Invoice tab.</div>
      </div>
    </div>
  </div>`;
}
</script>
<style>
/* ---- interaction layer additions ---- */

<script>
/* ============================================================================
   TOASTS
   ============================================================================ */
function toast(kind,title,txt,ms){
  const wrap = $('#toasts'); if(!wrap) return;
  const d = document.createElement('div');
  d.className = 'toast ' + (kind||'');
  d.setAttribute('role', kind==='bad' ? 'alert' : 'status');
  d.innerHTML = ic(kind==='ok'?'check':kind==='bad'?'block':kind==='warn'?'warn':'info','class="ic"')
    + `<div><div class="t-title">${esc(title)}</div>${txt?`<div class="t-txt">${txt}</div>`:''}</div>`
    + `<button class="x" type="button" aria-label="Dismiss notification">${ic('x')}</button>`;
  d.querySelector('.x').addEventListener('click',()=>d.remove());
  wrap.appendChild(d);
  setTimeout(()=>{ if(d.parentNode) d.remove(); }, ms||5600);
}

/* ============================================================================
   DIALOGS — every operational action passes through a preview or confirmation
   ============================================================================ */
const PIPE_STEPS = ['Reading the purchase order','Reading the goods received note','Extracting the invoice',
                    'Normalizing units and rates','Running the rule engine','Preparing the resolution summary'];

function pv(rows){
  return `<div class="preview">${rows.map(r=>`<div class="preview-row"><span class="k">${esc(r[0])}</span><span class="v">${r[1]}</span></div>`).join('')}</div>`;
}
function warnBox(txt,danger){
  return `<div class="d-warn${danger?' danger':''}">${ic(danger?'block':'warn')}<span>${txt}</span></div>`;
}
function blockingBits(c){
  const b = (c.rules||[]).filter(r=>r.sev==='BLOCK');
  if(!b.length) return '<li>No blocking difference is outstanding.</li>';
  return b.map(r=>`<li><strong>${esc(r.name)}</strong> — ${esc(r.diff||r.reason)}${r.diffAmount?` (${esc(r.diffAmount)})`:''}</li>`).join('');
}
function contactFor(c){
  const loc = c.grn.deliveryLocation || 'the receiving location';
  return loc.split(',')[0] + ' — store manager';
}

function dialogDef(key,c,row){
  const D = {};
  const grn = c?c.grnNo:'', po = c?c.poNo:'';
  switch(key){
    case 'rerun': return {
      icon:'refresh', tone:'warn', title:'Re-run the match for this pair',
      sub: po+' · '+grn,
      body: `<p>The pipeline reads the purchase order, the receipt and the attached invoice again, normalizes units and rates, then evaluates every rule from the start.</p>
        ${pv([['Purchase order', esc(po)],['Goods received note', esc(grn)],
              ['Invoice', c&&c.invoice?esc(c.invoice.no):'Not attached'],
              ['Current result', (c?STATUS[c.status].label:'—')+(c&&c.attempt?' · attempt '+c.attempt:'')],
              ['Next attempt', c?('Attempt '+((c.attempt||0)+1)):'—']])}
        <p class="d-note">Nothing about the purchase order, the receipt or the invoice is changed. Only the match result is replaced.</p>`,
      confirm:'Re-run match', kind:'btn-primary',
      run:()=>{ S.busy='rerun'; startPipe('Match re-run complete', 'Attempt '+(((c&&c.attempt)||0)+1)+' finished on '+esc(grn)+'. In the prototype the result is unchanged.'); }
    };
    case 'upload': return {
      icon:'upload', tone:'info', title:'Upload invoice and re-run',
      sub: grn,
      body: `<div class="drop">${ic('filePlus')}<div class="dt1">Drop the vendor tax invoice here</div>
          <div class="dt2">PDF, JPEG or PNG · up to 10 MB · one document per receipt</div></div>
        ${warnBox('This is a prototype. No file is uploaded and nothing is sent to the extraction service.')}
        <p class="d-note">Once a readable copy is attached, extraction and the full rule pass run automatically against ${esc(grn)}.</p>`,
      confirm:'Upload and re-run', kind:'btn-primary',
      run:()=>{ S.busy='rerun'; startPipe('Invoice received', 'Extraction and matching finished for '+esc(grn)+'. In the prototype no document was stored.'); }
    };
    case 'reextract': return {
      icon:'eye', tone:'warn', title:'Read this invoice again',
      sub: c&&c.invoice?c.invoice.no:grn,
      body: `<p>The attached document is passed through extraction a second time. Every field currently shown on the Invoice tab is replaced by the new reading.</p>
        ${pv([['Document', c&&c.invoice?esc(c.invoice.fileLabel||'Vendor tax invoice'):'—'],
              ['Current confidence', c&&c.invoice?Math.round(c.invoice.ocrConfidence*100)+'%':'—'],
              ['Fields below the trusted level', c&&c.invoice?String(Object.keys(c.invoice.fieldConf||{}).filter(k=>c.invoice.fieldConf[k]<CONF_TRUST).length):'0']])}
        ${warnBox('Any value you have already checked against the paper copy will be read again and may change.')}`,
      confirm:'Re-extract invoice', kind:'btn-primary',
      run:()=>{ startPipe('Invoice re-extracted','The document was read again. Confidence and field values are refreshed.',
        ['Fetching the attached document','Detecting the document type','Reading header fields','Reading line items','Scoring confidence']); }
    };

function startPipe(doneTitle,doneTxt,steps){
  S.pipeSteps = steps || PIPE_STEPS;
  S.pipeStep = 0;
  paintDialog();
  const tick = ()=>{
    S.pipeStep++;
    if(S.pipeStep <= S.pipeSteps.length){ paintDialog(); setTimeout(tick, 480); }
    else { S.dialog=null; S.pipeStep=-1; S.pipeSteps=null; S.busy=null; render(); toast('ok',doneTitle,doneTxt); }
  };
  setTimeout(tick, 560);
}

function paintDialog(){
  const host = $('#dialogHost');
  if(!S.dialog){ host.innerHTML=''; return; }
  const row = S.rowId ? rowById(S.rowId) : null;
  const c = row ? buildCase(row) : null;
  const d = dialogDef(S.dialog, c, row);
  if(!d){ host.innerHTML=''; return; }

  if(S.pipeStep >= 0){
    const steps = S.pipeSteps || PIPE_STEPS;
    host.innerHTML = `<div class="scrim"><div class="dialog" role="dialog" aria-modal="true" aria-label="${esc(d.title)} in progress">
      <div class="d-head">
        <span class="d-icon warn">${ic('refresh')}</span>
        <span><span class="d-title">Running</span><span class="d-sub">${esc(d.sub||'')}</span></span>
      </div>
      <div class="d-body"><div class="pipe">
        ${steps.map((t,i)=>{
          const cls = i<S.pipeStep ? 'done' : (i===S.pipeStep ? 'active' : 'todo');
          return `<div class="pipe-step ${cls}"><span class="st">${i<S.pipeStep?ic('check'):''}</span>${esc(t)}</div>`;
        }).join('')}
      </div></div>
      <div class="d-foot"><span class="grow"></span><span class="sect-sub">Step ${Math.min(S.pipeStep+1,steps.length)} of ${steps.length}</span></div>
    </div></div>`;
    return;
  }

  host.innerHTML = `<div class="scrim" data-scrim="1"><div class="dialog" role="dialog" aria-modal="true" aria-labelledby="dlgTitle">
    <div class="d-head">
      <span class="d-icon ${d.tone||'info'}">${ic(d.icon||'info')}</span>
      <span><span class="d-title" id="dlgTitle">${esc(d.title)}</span>${d.sub?`<span class="d-sub">${esc(d.sub)}</span>`:''}</span>
      <button class="d-x" type="button" data-act="dclose" aria-label="Close dialog">${ic('x')}</button>
    </div>
    <div class="d-body">${d.body}</div>
    <div class="d-foot">
      <span class="grow"></span>
      <button class="btn sm" type="button" data-act="dclose">${d.confirm?'Cancel':'Close'}</button>
      ${d.confirm?`<button class="btn ${d.kind||'btn-primary'} sm" type="button" data-act="dok" id="dlgOk">${esc(d.confirm)}</button>`:''}
    </div>
  </div></div>`;
  const ok = document.getElementById('dlgOk') || host.querySelector('.d-foot .btn');
  if(ok) ok.focus();
}
function openDialog(key){ S.dialog=key; S.pipeStep=-1; paintDialog(); }
function closeDialog(){ S.dialog=null; S.pipeStep=-1; S.pipeSteps=null; $('#dialogHost').innerHTML=''; }
function confirmDialog(){
  const row = S.rowId ? rowById(S.rowId) : null;
  const c = row ? buildCase(row) : null;
  const d = dialogDef(S.dialog, c, row);
  if(!d) return closeDialog();
  if(d.run) d.run(); else closeDialog();
}

function demoGo(k){

               rules:'HA/rules', norm:'HC/lines', lowocr:'HB/invoice', noattach:'HD/grn',
               oready:'HB/oracle', opushed:'HF/oracle', ofail:'HC/oracle', oblocked:'HA/oracle'};
  if(map[k]){ reset(); S.ruleFilter=null; S.ruleOpen=null; S.liFilter='ALL'; go('#/case/'+map[k]); return; }
  if(k==='loading'){ reset(); S.loading=true; go('#/'); setTimeout(()=>{ S.loading=false; render(); }, 2600); return; }
  if(k==='noresults'){ reset(); S.q='mango pickle 5kg'; go('#/'); return; }
  if(k==='nodata'){ reset(); S.emptyData=true; go('#/'); return; }

function doExport(kind){
  S.pop=null; S.exportFail=false; S.busy='export'; render();
  setTimeout(()=>{
    S.busy=null;
    const n = viewRows().length;
    render();
    toast('ok','Export ready', n.toLocaleString('en-IN')+' rows · '+COLS.filter(c=>S.cols[c.k]).length+' columns · '+(kind==='csv'?'CSV':'Excel workbook')+'. In the prototype no file is written.');
  }, 850);
}
function runAll(){
  S.busy='runall'; render();
  setTimeout(()=>{ S.busy=null; render();
    toast('ok','Run all finished', stats(baseRows()).t.PENDING.toLocaleString('en-IN')+' pending pairs were queued. Results are unchanged in the prototype.');
  }, 2400);
}
function topScroll(){ const c=document.querySelector('.content'); if(c) c.scrollTo({top:0,behavior:'smooth'}); }

function act(name, arg, el){
  const R = ()=>render();
  switch(name){
    /* dashboard filters */
    case 'status':  S.status=arg; S.page=1; R(); break;
    case 'clearq':  S.q=''; S.page=1; S.focus='q'; R(); break;
    case 'clearall':S.q=''; S.status='ALL'; S.entity='ALL'; S.supplier='ALL'; S.dateKey='FY'; S.from=''; S.to=''; S.page=1; R(); break;
    case 'pop':     S.pop = S.pop===arg ? null : arg; R(); break;
    case 'colreset':COLS.forEach(c=>S.cols[c.k]= c.lock?true:!!c.on); R(); break;
    case 'date':    S.dateKey=arg; S.page=1; if(arg!=='CUSTOM') S.pop=null; R(); break;
    case 'export':  doExport(arg); break;
    case 'retryexport': S.exportFail=false; doExport('xlsx'); break;
    case 'dismissexport': S.exportFail=false; R(); break;
    case 'reloaddata': S.emptyData=false; S.loading=true; R(); setTimeout(()=>{S.loading=false;R();}, 900); break;
    case 'runall':  runAll(); break;
    case 'sort':    if(S.sort.k===arg) S.sort.d*=-1; else S.sort={k:arg, d:(arg==='gdate'||arg==='ival'||arg==='gval'||arg==='diff')?-1:1}; S.page=1; R(); break;
    case 'page':    S.page=Math.max(1,+arg||1); R(); topScroll(); break;

    /* case shell */
    case 'tab':     go('#/case/'+S.rowId+'/'+arg); break;
    case 'tech':    S.tech[arg]=!S.tech[arg]; R(); break;
    case 'matrix':  { const row=rowById(S.rowId), c=row?buildCase(row):null;
                      const cur = S.matrix===null ? ((c&&c.deliveries?c.deliveries.length:0)>1) : S.matrix;
                      S.matrix = !cur; R(); break; }
    case 'rerun':   openDialog('rerun'); break;

    /* invoice viewer */
    case 'zoom':    S.zoom = arg==='in' ? Math.min(3, S.zoom+0.25) : arg==='out' ? Math.max(0.5, S.zoom-0.25) : 1; R(); break;
    case 'rot':     S.rot = (S.rot+90)%360; R(); break;
    case 'full':    S.docFull = !S.docFull; R(); break;
    case 'doc':     go('#/case/'+S.rowId+'/invoice'); break;

    /* line items */
    case 'lifilter':S.liFilter=arg; S.lineHi=null; R(); break;

    /* rules */
    case 'rule':    { const row=rowById(S.rowId), c=buildCase(row);
                      const m = Object.assign({}, openRules(c)); m[arg] = !m[arg];
                      S.ruleOpen = m; R(); break; }
    case 'rulefilter': S.ruleFilter=arg; S.ruleOpen={}; R(); break;
    case 'goline':  { S.liFilter='ALL'; S.lineHi=arg; go('#/case/'+S.rowId+'/lines'); break; }
    case 'gorule':  { const row=rowById(S.rowId), c=buildCase(row);
                      const i = c.rules.findIndex(r=>r.code===arg);
                      S.ruleFilter='ALL'; S.ruleOpen = i>=0 ? {[i]:true} : {};
                      go('#/case/'+S.rowId+'/rules'); break; }

    /* oracle */
    case 'omiss':   { const row=rowById(S.rowId), c=buildCase(row);
                      const f=(c.oracle.sections||[]).reduce((a,s)=>a.concat(s.fields),[])
                              .find(x=>x.missing||x.v===''||x.v==null);
                      if(f){ S.oracleHi=f.k; R(); } break; }

    /* dialogs + demo */
    case 'dlg':     openDialog(arg); break;
    case 'dclose':  closeDialog(); break;
    case 'dok':     confirmDialog(); break;
    case 'demo':    S.demoOpen=false; demoGo(arg); renderDemo(); break;
    case 'democlose': S.demoOpen=false; renderDemo(); break;
  }
}

let WIRED = false;
const PASSIVE_ACTS = {q:1, entity:1, supplier:1, per:1, jump:1, dfrom:1, dto:1, col:1};

function wireOnce(){
  if(WIRED) return; WIRED = true;

  let rz; window.addEventListener('resize', ()=>{ clearTimeout(rz); rz=setTimeout(()=>{ fitDoc(); syncStickyCols(); }, 90); });

  document.addEventListener('click', e=>{
    if(e.target.closest('[data-scrim="1"]') && !e.target.closest('.dialog')){ closeDialog(); return; }
    const el = e.target.closest('[data-act]');
    if(!el){
      if(S.pop && !e.target.closest('.pop-host')){ S.pop=null; render(); }
      if(S.demoOpen && !e.target.closest('.demo-panel') && !e.target.closest('#demoFab')){ S.demoOpen=false; renderDemo(); }
      return;
    }
    const name = el.getAttribute('data-act');
    if(PASSIVE_ACTS[name]) return;
    if(el.hasAttribute('disabled') || el.getAttribute('aria-disabled')==='true') return;
    if(el.tagName==='BUTTON') e.preventDefault();
    if(S.pop && !e.target.closest('.pop-host') && name!=='pop'){ S.pop=null; }
    act(name, el.getAttribute('data-arg'), el);
  });

  document.addEventListener('input', e=>{
    const el = e.target.closest && e.target.closest('[data-act]'); if(!el) return;
    if(el.getAttribute('data-act')==='q'){ S.q=el.value; S.page=1; S.focus='q'; render(); }
  });

  document.addEventListener('change', e=>{
    const el = e.target.closest && e.target.closest('[data-act]'); if(!el) return;
    const n = el.getAttribute('data-act');
    if(n==='entity'){ S.entity=el.value; S.page=1; render(); }
    else if(n==='supplier'){ S.supplier=el.value; S.page=1; render(); }
    else if(n==='per'){ S.per=+el.value; S.page=1; render(); }
    else if(n==='col'){ S.cols[el.getAttribute('data-arg')] = el.checked; render(); }
    else if(n==='dfrom'){ S.from=el.value; S.dateKey='CUSTOM'; S.page=1; S.focus='dFrom'; render(); }
    else if(n==='dto'){ S.to=el.value; S.dateKey='CUSTOM'; S.page=1; S.focus='dTo'; render(); }
    else if(n==='jump'){ jumpTo(el.value); }
  });

  document.addEventListener('keydown', e=>{
    if(e.key==='Enter'){
      const j = e.target.closest && e.target.closest('[data-act="jump"]');
      if(j){ e.preventDefault(); jumpTo(j.value); return; }
    }
    if(e.key!=='Escape') return;
    if(S.dialog){ closeDialog(); return; }
    if(S.docFull){ S.docFull=false; render(); return; }
    if(S.pop){ S.pop=null; render(); return; }
    if(S.demoOpen){ S.demoOpen=false; renderDemo(); }
  });

  const rt = $('#railToggle');
  if(rt) rt.addEventListener('click', ()=>{
    const app = $('#app'); const now = app.classList.toggle('rail-collapsed');
    rt.setAttribute('aria-label', now?'Expand navigation':'Collapse navigation');
  });
  const fab = $('#demoFab');
  if(fab) fab.addEventListener('click', ()=>{ S.demoOpen=!S.demoOpen; renderDemo(); });
}

function jumpTo(v){
  const total = S.emptyData ? 0 : viewRows().length;
  const pages = Math.max(1, Math.ceil(total/S.per));
  const p = Math.max(1, Math.min(pages, parseInt(v,10)||1));
  S.page = p; render(); topScroll();
}

function wireSplit(){
  const wrap = document.querySelector('.split'); if(!wrap) return;
  const g = wrap.querySelector('.gripper'); if(!g) return;
  const set = pct=>{ S.split=Math.round(pct); wrap.style.setProperty('--split-l', S.split+'%'); g.setAttribute('aria-valuenow', S.split); fitDoc(); };
  let dragging = false;
  const onMove = e=>{ if(!dragging) return; const r=wrap.getBoundingClientRect();
    set(Math.max(24, Math.min(70, ((e.clientX-r.left)/r.width)*100))); fitDoc(); };
  const stop = ()=>{ if(!dragging) return; dragging=false;
    document.body.style.cursor=''; document.body.style.userSelect='';
    window.removeEventListener('pointermove', onMove); window.removeEventListener('pointerup', stop); };
  g.addEventListener('pointerdown', e=>{ dragging=true; e.preventDefault();
    document.body.style.cursor='col-resize'; document.body.style.userSelect='none';
    window.addEventListener('pointermove', onMove); window.addEventListener('pointerup', stop); });
  g.addEventListener('dblclick', ()=>set(42));
  g.addEventListener('keydown', e=>{
    let d=0;
    if(e.key==='ArrowLeft') d=-2; else if(e.key==='ArrowRight') d=2;
    else if(e.key==='Home'){ e.preventDefault(); return set(42); }
    if(!d) return; e.preventDefault(); set(Math.max(24, Math.min(70, S.split+d)));
  });
}

/* Fit the 600px facsimile to whatever width the document pane currently has.
   S.zoom is a multiplier on top of that fit, and the readout shows the real scale. */
function fitDoc(){
  document.querySelectorAll('.docview').forEach(view=>{
    const sizer = view.querySelector('.doc-sizer'), stage = view.querySelector('.doc-stage'),
          paper = view.querySelector('.paper');
    if(!sizer || !stage || !paper) return;
    const cs = getComputedStyle(view),
          avail = view.clientWidth - parseFloat(cs.paddingLeft||0) - parseFloat(cs.paddingRight||0),
          pw = paper.offsetWidth || 600, ph = paper.offsetHeight || 800,
          turned = (S.rot % 180) !== 0,
          across = turned ? ph : pw;
    const fit = Math.max(0.2, Math.min(1.6, avail / across));
    const sc = Math.max(0.15, fit * S.zoom);
    const tx = S.rot===90 ? sc*ph : S.rot===180 ? sc*pw : 0;
    const ty = S.rot===180 ? sc*ph : S.rot===270 ? sc*pw : 0;
    stage.style.transform = `translate(${tx}px, ${ty}px) scale(${sc}) rotate(${S.rot}deg)`;
    sizer.style.width  = Math.ceil(sc * (turned ? ph : pw)) + 'px';
    sizer.style.height = Math.ceil(sc * (turned ? pw : ph)) + 'px';
    const read = view.parentNode && view.parentNode.querySelector('.zoomval');
    if(read) read.textContent = Math.round(sc*100) + '%';
  });
}

/* The pinned columns park at the running width of the columns to their left.
   Those widths come from the data on the page, so they are measured rather
   than assumed — otherwise a long PO number slides underneath its neighbour. */
function syncStickyCols(){
  document.querySelectorAll('table.dt').forEach(t=>{
    const c1 = t.querySelector('thead .c1'), c2 = t.querySelector('thead .c2');
    if(c1) t.style.setProperty('--c1w', Math.round(c1.getBoundingClientRect().width)+'px');
    if(c2) t.style.setProperty('--c2w', Math.round(c2.getBoundingClientRect().width)+'px');
  });
}

function afterRender(){
  wireSplit();
  fitDoc();
  syncStickyCols();
  const ch = document.querySelector('.case-head');
  document.documentElement.style.setProperty('--case-head-h', (ch ? Math.round(ch.getBoundingClientRect().height) : 160) + 'px');

  /* A sticky panel taller than the scroll area can never show its own bottom,
     so in that case let it scroll with the page instead. */
  const rb = document.querySelector('.resbox'), sc = document.querySelector('.content');
  if(rb && sc){
    rb.classList.remove('no-stick');
    if(rb.getBoundingClientRect().height > sc.clientHeight - 32) rb.classList.add('no-stick');
  }

  if(S.focus){
    const el = document.getElementById(S.focus==='q'?'q':S.focus);
    if(el){ el.focus(); if(el.type==='search'||el.type==='text'){ const v=el.value; el.value=''; el.value=v; } }
    S.focus = null;
  }
  if(S.oracleHi){
    const k = S.oracleHi, el = document.getElementById('of-'+k);
    if(el){ el.scrollIntoView({block:'center', behavior:'smooth'});
      setTimeout(()=>{ const e2=document.getElementById('of-'+k); if(e2) e2.classList.remove('hilite'); }, 1900); }
    S.oracleHi = null;
  }
  if(S.lineHi){
    const k = S.lineHi, el = document.getElementById('li-'+k);
    if(el){ el.scrollIntoView({block:'start', behavior:'smooth'});
      setTimeout(()=>{ const e2=document.getElementById('li-'+k); if(e2) e2.classList.remove('hi'); }, 2400); }
    S.lineHi = null;
  }
  const pop = document.querySelector('.pop');
  if(pop){ const first = pop.querySelector('button,input:not([disabled])'); if(first && S.pop!=='date') first.focus({preventScroll:true}); }
}

/* ---- boot ---- */
renderNav();
wireOnce();
route();
</script>
